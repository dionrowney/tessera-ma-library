# What tools/preview.py shows (docs/PREVIEW.md): a Music Assistant player and a page of playlists, as
# music_assistant.get_library answers (made-up names, no real library's).
tiles:
  - tile: library
    name: Playlists
    entity: media_player.office
    options: { list: playlist }
    sizes: [1x1, 2x1]
  - tile: library
    name: Artists
    entity: media_player.office
    options: { list: artist }
    sizes: [1x1]
  - tile: library
    name: Radio
    entity: media_player.office
    options: { list: radio }
    sizes: [1x1]
  - tile: library
    name: Podcasts
    entity: media_player.office
    options: { list: podcast }
    sizes: [1x1]
  - tile: library
    sizes: [1x1]

states:
  media_player.office:
    state: idle
    attributes: { friendly_name: Office, mass_player_type: player }

commands:
  "call_service:music_assistant.get_library":
    limit: 12
    offset: 0
    order_by: name
    media_type: playlist
    items:
      - { media_type: playlist, uri: "library://playlist/1", name: Afternoon Focus }
      - { media_type: playlist, uri: "library://playlist/2", name: Basement Workshop }
      - { media_type: playlist, uri: "library://playlist/3", name: Coffee and Rain }
      - { media_type: playlist, uri: "library://playlist/4", name: Deep Work Ambient }
      - { media_type: playlist, uri: "library://playlist/5", name: Friday Night Mix }
      - { media_type: playlist, uri: "library://playlist/6", name: Garden Party }
      - { media_type: playlist, uri: "library://playlist/7", name: Long Drive Home }
      - { media_type: playlist, uri: "library://playlist/8", name: Morning Run }
      - { media_type: playlist, uri: "library://playlist/9", name: Road Trip Classics }
      - { media_type: playlist, uri: "library://playlist/10", name: Saturday Cleanup }
      - { media_type: playlist, uri: "library://playlist/11", name: Sunday Morning }
      - { media_type: playlist, uri: "library://playlist/12", name: Winding Down }
